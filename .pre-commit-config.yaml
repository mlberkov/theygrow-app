# Pre-commit hooks for theygrow-app — local mirror of the CI quality gate.
# CI (.github/workflows/ci.yml) is the gate of record; this runs the same checks
# locally. With /api landed (M2-P2), the Ruff/mypy hooks have teeth on api/.
#
# Auto-fixing hygiene hooks (trailing-whitespace, end-of-file-fixer) EXCLUDE the
# live-deploy paths (AGENTS.md §7 guardrail) and data/ (the frozen masterplan) so
# the harness never churns or touches those files. The build-config relocated
# into the owning subtrees in M2-P3, so the excludes track app/ (PWA:
# index.html/sw.js/manifest.json/offline.html/nginx.conf/Dockerfile/cloudbuild.yaml/icons,
# plus kb-v1.json — the vendored KB artifact is consumed byte-as-published, VDK-P2 —
# m/, the versioned module mount, A1-P3, and docker-entrypoint.sh, the PWA container
# entrypoint, A3-P1: every shipped app/ file is excluded, and the version-agnostic
# m/ prefix means a future /m/v{N}/ inherits it)
# and api/ (Dockerfile/cloudbuild.yaml, plus cloudbuild.staging.yaml — the A2-P1
# staging build-config is a live-deploy path on the same footing). Read-only
# validators (check-yaml, check-json) run repo-wide.
#
# A1-P1 adds app/tests/__baselines__/ to the same excludes, for the kb-v1.json
# reason: those files are byte-exact comparands. trailing-whitespace would strip
# meaningful trailing space inside captured HTML and silently corrupt the parity
# baselines. The suite's own source (app/tests/*.js, app/playwright.config.js)
# stays INSIDE the hooks' reach — only the recorded artifacts are excluded.
#
# L1-P1 adds native/android/ for a third reason again: that tree is GENERATED by
# `npx cap add android` and regenerated by `cap sync`. Reformatting Gradle,
# Java and XML the toolchain owns would produce a diff on every sync and hide
# the one file in it that IS hand-edited (AndroidManifest.xml, whose backup
# hardening a test pins). The hand-authored half of the Capacitor shell —
# native/tools/, native/package.json, native/capacitor.config.json — stays
# INSIDE the hooks' reach; only the generated project is excluded. The
# read-only validators still run over everything.

# PPR-P1 adds two paths, and the second one is why: it was MEASURED, not foreseen.
# app/privacy.html joins the app/ list on the standing rule above — it is a shipped
# live-deploy file, so the harness does not churn it. docs/privacy-policy-v* is a
# different reason entirely. It is the owner's privacy policy, copied into the repo
# verbatim, and its header block ends two lines with the Markdown HARD LINE BREAK —
# two trailing spaces. trailing-whitespace stripped them on the first run of this
# hook over the file, which turns «Продукт / Версия / Дата вступления в силу» from
# three lines into one run-on paragraph in every renderer. That is the `data/`
# reason exactly (meaningful whitespace in a frozen artifact), reached from the
# other direction: here the file is not frozen but AUTHORED ELSEWHERE, and the
# harness is not its editor. The prefix is version-agnostic on the `m/` precedent,
# so a later redaction (v1.1, v2.0) inherits the exclusion instead of losing its
# line breaks on the day it lands.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.2
    hooks:
      - id: ruff           # lint (replaces flake8); isort via the I rule set
        args: [--fix]
      - id: ruff-format    # format (replaces Black)

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        # Strict type-check the /api package. pass_filenames is off so the whole
        # package resolves as a unit; additional_dependencies make api's imports
        # available in the hook's isolated venv.
        #
        # L1-P2 adds app/tests/schema — the desktop tests for the native store's
        # frozen DDL. They import the standard library only (sqlite3, pathlib)
        # plus pytest, which is already declared below, so the dependency list
        # is unchanged. The directory carries an __init__.py so mypy resolves it
        # as the package `schema`; without it, its conftest would collide with
        # api/tests/conftest.py as a duplicate top-level module.
        #
        # L1-P3 adds app/tests/export on the same terms — standard library only
        # (json, zipfile, sqlite3, subprocess) plus pytest, so the dependency
        # list is again unchanged, and it carries an __init__.py for the same
        # collision reason. It imports `schema.harness`, which resolves because
        # both are packages under the same app/tests root.
        #
        # RSN-P2 adds the release signature detector and its suite on the same
        # terms — standard library only (argparse, re, shutil, subprocess) plus
        # pytest, so the dependency list is unchanged again. app/tests/release
        # carries an __init__.py for the same collision reason.
        #
        # FIU-P5 adds the veraPDF failure printer on the same terms once more —
        # standard library only (argparse, pathlib, xml.etree) — so the
        # dependency list is unchanged for the third time. Its own suite lives in
        # app/tests/export, which is already listed.
        args: [
          --config-file=pyproject.toml,
          api,
          app/tests/schema,
          app/tests/export,
          app/tests/release,
          scripts/verify_release_signature.py,
          scripts/verapdf_failures.py,
        ]
        pass_filenames: false
        additional_dependencies:
          - fastapi
          - pydantic
          - pydantic-settings
          - pytest
          - httpx
          - sqlalchemy>=2.0
          - pgvector>=0.3
          - alembic>=1.13   # conftest imports alembic.command/.config (tests are type-checked)
          - openai>=1.0     # typed adapters import openai (ships py.typed)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '^(app/(index\.html|sw\.js|manifest\.json|offline\.html|privacy\.html|nginx\.conf|docker-entrypoint\.sh|Dockerfile|cloudbuild\.yaml|icons/|kb-v1\.json|m/|tests/__baselines__/)|api/(Dockerfile|cloudbuild(\.staging)?\.yaml)|native/android/|data/|docs/privacy-policy-v)'
      - id: end-of-file-fixer
        exclude: '^(app/(index\.html|sw\.js|manifest\.json|offline\.html|privacy\.html|nginx\.conf|docker-entrypoint\.sh|Dockerfile|cloudbuild\.yaml|icons/|kb-v1\.json|m/|tests/__baselines__/)|api/(Dockerfile|cloudbuild(\.staging)?\.yaml)|native/android/|data/|docs/privacy-policy-v)'
      - id: check-yaml     # read-only validator, repo-wide
      - id: check-json     # read-only validator, repo-wide

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks       # M1-P3-INV-001 — no secrets committed

  - repo: local
    hooks:
      - id: contract-integrity
        name: contract-integrity (M1-P3-INV-002)
        entry: scripts/check-contract-integrity.sh
        language: script
        pass_filenames: false
        always_run: true
