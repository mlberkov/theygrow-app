# RSN-P2 — the signed release build.
#
# Produces a signed release APK and PROVES the signature by machine: the
# certificate SHA-256 apksigner reports is compared against the fingerprint
# committed at native/android/release-signing/cert-sha256.txt. A mismatch turns
# this run red on its own. Nobody is asked to read a fingerprint off a log and
# decide — the print stays because ADR-047 detector (a) wants it there, but the
# verdict is an exit code.
#
# WHY ITS OWN FILE, AND WHY THESE TRIGGERS. Every run of this workflow decodes
# the release keystore, so the number of runs that touch that secret is
# minimised deliberately (solo-shortcuts-registry C-2: the keystore living in
# Actions is an accepted shortcut whose downside is irreversible, and the
# mitigations available today are the no-echo rule and not running this often).
# Tag push and manual dispatch only. There is deliberately NO `push` on
# branches: bolting this onto ci.yml would touch the keystore on every commit.
#
# WHAT THIS WORKFLOW DOES NOT DO: publish. No release is created, no asset is
# uploaded, no `gh` is invoked, and `permissions` stays `contents: read`
# (PDR-018 — widening pipeline permissions is a controlled class, and ADR-047
# records automated asset publication as a separate decision that has not been
# taken). The owner downloads the artifact and publishes both files by hand;
# ADR-020 — merge is not delivery, and the Android channel has no automatic
# delivery at all.
#
# HYGIENE. No `echo` of a signing value, no `set -x`, no shell tracing. No
# secret is interpolated into a `run:` string — the three signing variables and
# the base64 keystore reach the shell through `env:` only, and the signing
# variables are scoped to the single step that builds, never to the workflow.
# The decoded keystore lives under RUNNER_TEMP, never in the workspace or the
# build tree, and is removed in a final step that runs even when an earlier step
# fails. The certificate fingerprint is NOT a secret and is committed on purpose.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Two simultaneous runs would both have the keystore decoded on disk. Never
  # cancel one in flight either — a cancelled run can be killed before its
  # cleanup step completes.
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth: 0 is REQUIRED, not tidiness. versionCode is
      # `git rev-list --count HEAD` and native/android/app/build.gradle treats a
      # shallow clone as unresolved, failing the release path closed with
      # THEYGROW_RELEASE_VERSIONCODE_UNRESOLVED. That is by design: a release APK
      # carrying a wrong versionCode cannot be updated over, and the update chain
      # carries family data (ADR-043 §3).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node 22 / Java 21 for the same reasons the `android` job in ci.yml gives:
      # @capacitor/cli hard-fails below node 22, and capacitor.build.gradle pins
      # source/targetCompatibility to VERSION_21.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the Capacitor toolchain
        working-directory: native
        run: npm ci

      # The same web-root staging shape the `android` job uses, so what is
      # released is assembled by the same sequence that is gated on every push.
      - name: Stage the web root from app/Dockerfile's COPY list
        run: node native/tools/stage-webdir.js

      - name: Sync the staged web root into the Android project
        working-directory: native
        run: node tools/reset-sync-target.js && npx cap sync android

      # Into RUNNER_TEMP — never the workspace, never the build tree. `printf` is
      # a bash BUILTIN writing to a pipe: the value never becomes a process
      # argument (so it never appears in /proc), and nothing here writes it to
      # the log. The no-echo rule is about reaching the log, and this does not.
      - name: Decode the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "${RUNNER_TEMP}/signing"
          if ! printf '%s' "${ANDROID_KEYSTORE_BASE64}" \
               | base64 --decode > "${RUNNER_TEMP}/signing/release.p12"; then
            echo "::error::THEYGROW_RELEASE_KEYSTORE_DECODE_FAILED: ANDROID_KEYSTORE_BASE64"\
                 "did not decode as base64. Nothing about its CONTENT is known or printed"\
                 "here. The cure is to re-mint the secret and is owner-run."
            exit 1
          fi
          chmod 600 "${RUNNER_TEMP}/signing/release.p12"
          if [ ! -s "${RUNNER_TEMP}/signing/release.p12" ]; then
            echo "::error::THEYGROW_RELEASE_KEYSTORE_DECODE_FAILED: the decoded keystore is"\
                 "empty. The cure is to re-mint the secret and is owner-run."
            exit 1
          fi

      # The three signing variables are scoped to THIS STEP only. Gradle reads a
      # PATH, never the base64 transport encoding — decoding is the workflow's
      # job so the encoded key never enters the Gradle process. There is no
      # fourth secret: PKCS12 has no separate key-entry password, and
      # build.gradle feeds keyPassword the same variable on purpose.
      - name: Assemble the signed release APK
        working-directory: native/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/signing/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew --no-daemon :app:assembleRelease

      # ARM THE DETECTOR BEFORE TRUSTING IT. The verdict below only ever returns
      # green on a run holding the real secret, so a green release run should
      # carry its own evidence that the comparator was live IN THIS RUN rather
      # than borrowing it from a test that ran elsewhere.
      #
      # The differing input is GENERATED HERE, derived from the live baseline by
      # flipping its last nibble. It is deliberately not a committed fixture: a
      # fixture can be edited into agreement with a broken comparator, and then
      # this step would pass while proving nothing. Derived in-run, it tracks the
      # baseline automatically and cannot drift.
      - name: The signature comparator is armed
        run: |
          set -euo pipefail
          baseline="$(sed 's/#.*//' native/android/release-signing/cert-sha256.txt \
                      | tr -d '[:space:]:' | tr 'A-F' 'a-f')"
          if [ "${#baseline}" -ne 64 ]; then
            echo "::error::the committed baseline is not 32 hex octets; the arm-check"\
                 "cannot derive a differing value from it"
            exit 1
          fi
          head="${baseline:0:63}"
          if [ "${baseline:63:1}" = "0" ]; then flipped="${head}1"; else flipped="${head}0"; fi

          printf 'Verifies\nNumber of signers: 1\nSigner #1 certificate SHA-256 digest: %s\n' \
            "${flipped}" > "${RUNNER_TEMP}/armcheck-certs.txt"

          set +e
          python3 scripts/verify_release_signature.py \
            --certs-output "${RUNNER_TEMP}/armcheck-certs.txt" \
            --baseline native/android/release-signing/cert-sha256.txt
          status=$?
          set -e
          if [ "${status}" -ne 3 ]; then
            echo "::error::the comparator returned ${status} against a fingerprint that"\
                 "differs from the baseline; expected 3 (THEYGROW_RELEASE_CERT_MISMATCH)."\
                 "The verdict in the next step cannot be trusted and this run must not"\
                 "produce a release artifact."
            exit 1
          fi

      # THE VERDICT. Runs the real apksigner and compares against the committed
      # fingerprint. Mismatch, unsigned APK, unparseable output, missing baseline
      # and more than one signing identity all fail the job.
      - name: Verify the APK is signed by our key
        run: |
          set -euo pipefail
          python3 scripts/verify_release_signature.py \
            --apk native/android/app/build/outputs/apk/release/app-release.apk \
            --baseline native/android/release-signing/cert-sha256.txt

      # versionCode/versionName are read from what the build EMITTED, not
      # re-derived from git: re-deriving would agree with itself even if the APK
      # disagreed, and the filename is a claim about the APK. A static "latest"
      # name is wrong — the owner publishes this file by hand and a release page
      # must not carry two different binaries under one name.
      - name: Stage the release artifact and its checksum
        run: |
          set -euo pipefail
          outdir="${RUNNER_TEMP}/release-out"
          install -d "${outdir}"

          # Written to a file rather than read through a process substitution, so
          # that a failing python3 fails this step under `set -e` instead of
          # quietly yielding an empty read.
          python3 - > "${RUNNER_TEMP}/version.txt" <<'PY'
          import json
          import pathlib
          import sys

          metadata = pathlib.Path(
              "native/android/app/build/outputs/apk/release/output-metadata.json"
          )
          if not metadata.is_file():
              sys.exit(f"::error::{metadata} is absent; the artifact cannot be named")
          elements = json.loads(metadata.read_text(encoding="utf-8")).get("elements") or []
          if not elements:
              sys.exit(f"::error::{metadata} lists no output elements")
          name = str(elements[0].get("versionName") or "").strip()
          code = str(elements[0].get("versionCode") or "").strip()
          if not name or not code:
              sys.exit(f"::error::{metadata} carries no versionName/versionCode")
          print(name, code)
          PY

          read -r version_name version_code < "${RUNNER_TEMP}/version.txt"

          apk="theygrow-v${version_name}-${version_code}.apk"
          cp native/android/app/build/outputs/apk/release/app-release.apk "${outdir}/${apk}"

          # sha256sum's own format, so a downloader can `sha256sum -c` it in
          # place next to the APK. ADR-047 §8 — the checksum is published beside
          # the download, and it is computed here so what is published is what
          # this run produced.
          ( cd "${outdir}" && sha256sum "${apk}" > "${apk}.sha256" )
          ( cd "${outdir}" && sha256sum -c "${apk}.sha256" )
          ls -l "${outdir}"

      - name: Upload the signed release APK and its checksum
        uses: actions/upload-artifact@v4
        with:
          name: theygrow-release-apk
          # A dedicated subdirectory, never RUNNER_TEMP itself — the decoded
          # keystore also lives under RUNNER_TEMP.
          path: ${{ runner.temp }}/release-out/
          retention-days: 30
          if-no-files-found: error

      # Runs even when an earlier step failed, and fails the job if the keystore
      # is somehow still there. `rm`, not `shred`: the runner VM and its disk are
      # destroyed with the run, and shred on an overlay filesystem does not
      # deliver what its name promises — claiming otherwise would be worse than
      # doing the honest thing.
      - name: Remove the decoded keystore
        if: always()
        run: |
          set -euo pipefail
          rm -f "${RUNNER_TEMP}/signing/release.p12"
          rmdir "${RUNNER_TEMP}/signing" 2>/dev/null || true
          if [ -e "${RUNNER_TEMP}/signing/release.p12" ]; then
            echo "::error::the decoded keystore is still on disk at the end of the run"
            exit 1
          fi
