# Tool configuration for theygrow-app.
#
# This file carries quality-harness config only (Ruff + mypy). It is intentionally
# NOT a buildable package: there is no [project] table and no Python source yet.
# The Python subtree lands at /api in M2 (AGENTS.md §8); these tools are pre-sized
# for it. Until then there are zero Python targets and the tools no-op cleanly.

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["api"]
extend-exclude = [".ruff_cache", ".mypy_cache", ".pytest_cache"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort (replaces standalone isort), UP pyupgrade,
# B flake8-bugbear. Conservative starter set; widened when /api lands.
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
# Strict-on-new-code posture. No `files`/`packages` is set on purpose: mypy runs on
# CLI-provided paths (CI: `mypy api`) and on staged Python files (pre-commit). With
# /api landed (M2-P2) it has teeth on the api/ subtree.
#
# The pydantic plugin is required for env-sourced pydantic-settings BaseSettings:
# without it, dataclass_transform makes default-less fields required constructor
# args, but those fields are populated from the environment, not at the call site.
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
# Alembic migration plumbing (env.py + generated versions/) is excluded from the
# strict gate: it is imperative DDL scaffolding, not product code, and the
# generated revision modules don't carry strict annotations. The table shape it
# emits is validated at runtime by the DB-backed constraint tests instead.
exclude = ['^api/alembic/']
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true

# pgvector ships no py.typed marker (its SQLAlchemy `Vector` type is used in the
# M3 source model). Allow the untyped import without relaxing strictness anywhere
# else.
[[tool.mypy.overrides]]
module = "pgvector.*"
ignore_missing_imports = true
