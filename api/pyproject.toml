# theygrow-api — the FastAPI backend (M2).
#
# Self-contained PEP 621 package: /api owns its runtime + dev dependencies, the
# same way /app owns its static assets. The ROOT pyproject.toml stays the single
# source of tooling config (Ruff + mypy); this file carries metadata + deps ONLY
# and intentionally defines no [tool.*] config.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "theygrow-api"
version = "0.0.0"
description = "theygrow-app FastAPI backend (M2 skeleton)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.5",
  # Core store (ADR-008): one managed PostgreSQL as SoT. The episodic source
  # layer lands in M3-P1 (schema + migration; the importer is M3-P2).
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",   # psycopg3 driver — postgresql+psycopg://
  "pgvector>=0.3",          # per-chunk vector(1536); populated by the M4-P2 backfill
  "alembic>=1.13",          # migration tooling + deploy-time release step
  # Embeddings PROVIDER client (M4-P2 / ADR-011 §1) — a donor-lifted adapter behind
  # the provider-port, NOT the diary-memory-service engine (no memory_rag import).
  "openai>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[project.scripts]
# M3-P2 offline /export importer (also runnable as `python -m theygrow_api.importer`).
theygrow-import-export = "theygrow_api.importer:main"
# M4-P1 offline notes/event_chunks re-derivation pass (also `python -m theygrow_api.derivation`).
theygrow-rederive = "theygrow_api.derivation:main"
# M4-P2 offline embeddings backfill (also `python -m theygrow_api.embeddings_backfill`).
theygrow-embed = "theygrow_api.embeddings_backfill:main"
# A2-P2 staging seed: chains the three passes above against the STAGING database only,
# behind a fail-closed contour guard (also `python -m theygrow_api.seed_staging`).
theygrow-seed-staging = "theygrow_api.seed_staging:main"

[tool.hatch.build.targets.wheel]
packages = ["theygrow_api"]
