# The live Cloud SQL / secret / service-account identifiers are NOT in this repo: they
# arrive as trigger substitutions with empty defaults (A3-P2), the same technique as
# api/cloudbuild.staging.yaml and app/cloudbuild.yaml. Values live in docs/RUNBOOK.md
# ("Live-infra divergence") and are set by the owner in the Cloud Build console.
#
# SUBSTITUTIONS: what this file does NOT guarantee (corrected in L1-P1). This header used
# to state that Cloud Build's "default MUST_MATCH option" was kept deliberately and turns a
# substitution-name typo into a red build. The verifiable fact is that NONE of the three
# build-configs in this repository declares substitutionOption at all — `options:` below
# carries only `logging`. This file therefore asserts nothing about substitution matching,
# and the typo protection described here previously does not exist.
# (Separately: an unverified upstream note holds that trigger-invoked builds run under
# ALLOW_LOOSE. It has been confirmed neither here nor by the owner as of L1-P1 and is
# carried as open debt in docs/RUNBOOK.md — do not rely on it as established.)
# What DOES protect the deploy is the Step 0 guard below: it fails the build when a
# substitution is empty, which is exactly what a mis-named key resolves to. Switching to an
# explicit MUST_MATCH is deliberately deferred — the delivery channel is currently the only
# one, and a substitution mismatch would break it outright.
#
# ORDERING, shared with A3-P1's: these substitutions are set AFTER the packet merges,
# never before. See docs/RUNBOOK.md "Production database enablement" and
# "Same-origin /api proxy" — and note that the ordering is now kept as the safe sequence,
# not because a MUST_MATCH failure forces it.
substitutions:
  # Cloud SQL instance connection name (project:region:instance).
  _CLOUDSQL_INSTANCE: ''
  # Secret Manager secret holding the production DATABASE_URL (socket form — RUNBOOK).
  _DB_SECRET_NAME: ''
  # Runtime service account this service runs as (dedicated, least-privilege).
  _API_RUNTIME_SA: ''

steps:
  # Step 0: fail fast on an unconfigured trigger. This guard is load-bearing, not
  # decorative, and this is the config where it matters most: an empty
  # --add-cloudsql-instances parses to an EMPTY LIST, so the deploy SUCCEEDS with no Cloud
  # SQL attachment and /api/health — which needs no environment — stays green. The only
  # thing that would notice is /api/health/ready, on a revision that already looks
  # deployed. Values travel through env: and are dereferenced with $$VAR, because Cloud
  # Build substitutes $VAR textually before this container ever runs.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    env:
      - 'CLOUDSQL_INSTANCE=${_CLOUDSQL_INSTANCE}'
      - 'DB_SECRET_NAME=${_DB_SECRET_NAME}'
      - 'API_RUNTIME_SA=${_API_RUNTIME_SA}'
    args:
      - '-c'
      - |
        set -euo pipefail
        missing=0
        [ -n "$$CLOUDSQL_INSTANCE" ] || { echo "FATAL: trigger substitution _CLOUDSQL_INSTANCE is empty" >&2; missing=1; }
        [ -n "$$DB_SECRET_NAME" ]    || { echo "FATAL: trigger substitution _DB_SECRET_NAME is empty"    >&2; missing=1; }
        [ -n "$$API_RUNTIME_SA" ]    || { echo "FATAL: trigger substitution _API_RUNTIME_SA is empty"    >&2; missing=1; }
        [ "$$missing" -eq 0 ] || { echo "FATAL: production /api trigger is not configured — see docs/RUNBOOK.md 'Production database enablement'" >&2; exit 1; }
        echo "production /api trigger substitutions present"

  # Step 1: build the /api image (build context = ./api)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'europe-west1-docker.pkg.dev/ordinal-avatar-479419-t7/theygrow-api-repo/api:$COMMIT_SHA', 'api']

  # Step 2: push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'europe-west1-docker.pkg.dev/ordinal-avatar-479419-t7/theygrow-api-repo/api:$COMMIT_SHA']

  # Step 3: deploy to its OWN Cloud Run service (own URL). Since A3-P1 that URL is
  # reachable only through the PWA container's same-origin /api proxy (ADR-038 / ADR-007);
  # the browser never talks to it directly and no CORS header is ever issued.
  # Since A3-P2 this deploy IS database-wired: --add-cloudsql-instances mounts the Cloud SQL
  # Auth proxy as a Unix socket, --set-secrets injects DATABASE_URL from Secret Manager, and
  # --service-account pins a dedicated least-privilege runtime identity. Before A3-P2 the
  # service carried none of the three and its whole served surface was /api/health, which
  # needs no environment; GET /api/health/ready is what changed that. Liveness stays
  # environment-free by design — on a rollback to an unattached revision it is the route
  # that keeps answering.
  #
  # --service-account is NOT optional and NOT deferrable: the default compute account
  # carries roles/editor and is shared by Cloud Build and both runtimes, so granting
  # roles/cloudsql.client there would open the family database to every workload in the
  # project (ADR-038 as amended). Cloud Build needs roles/iam.serviceAccountUser on this
  # account or the deploy fails with an actAs error that names nothing useful.
  # The project holds FOUR identities (A3-DL-004): that default compute account, the PWA
  # runtime account, the /api runtime account this flag names, and a legacy Cloud Build
  # agent account holding roles/cloudbuild.builds.builder that no trigger runs under.
  # Three branches still to narrow, default account last.
  #
  # --max-instances 2 is a CHANGE, not a default: the live service ran with maxScale 20, so
  # this narrows the ceiling tenfold. It is what brings the deployed service under the
  # ceiling rule — max-instances x db_pool_size <= 30, the application role's CONNECTION
  # LIMIT. Shipped: 2 x 2 = 4, wide headroom; at maxScale 20 the demand would be 40, over
  # the ceiling. The 30 is INSTANCE-derived and supersedes the 10 A3-P2 assumed here
  # (A3-DL-004; the derivation is in docs/RUNBOOK.md "Production database enablement").
  # The flag and the pool move together. RAISE THE ROLE'S CONNECTION LIMIT BEFORE RAISING THIS.
  #
  # --no-allow-unauthenticated (A3-P1, was --allow-unauthenticated): the service takes
  # only authenticated calls, and the proxy authenticates service-to-service with a
  # metadata-minted ID token whose audience is this service's URL. The explicit negative
  # is deliberate — merely DROPPING the flag would leave an existing allUsers binding in
  # place, whereas the negative form actively removes it.
  #
  # This flag is SERVICE-level IAM, not revision-scoped: it applies the moment this deploy
  # runs, regardless of the --no-traffic split below. Editing this file also matches the
  # /api trigger's includedFiles = api/**, so merging the packet that changes it fires this
  # build. Hence the ordering constraint in docs/RUNBOOK.md "Same-origin /api proxy": the
  # PWA runtime service account must already hold roles/run.invoker here.
  #
  # --no-traffic --tag lands each push as a 0%-traffic, per-revision sha-tagged
  # revision: deploy stops meaning release, and promotion becomes an explicit owner
  # act gated on the staging eval (A2-P1; the L1 gate app/cloudbuild.yaml already
  # carries). See docs/RUNBOOK.md "Promotion + rollback (/api)".
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'theygrow-api'
      - '--image'
      - 'europe-west1-docker.pkg.dev/ordinal-avatar-479419-t7/theygrow-api-repo/api:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--no-allow-unauthenticated'
      - '--port'
      - '8080'
      - '--service-account'
      - '${_API_RUNTIME_SA}'
      - '--add-cloudsql-instances'
      - '${_CLOUDSQL_INSTANCE}'
      - '--set-secrets'
      - 'DATABASE_URL=${_DB_SECRET_NAME}:latest'
      - '--max-instances'
      - '2'
      - '--no-traffic'
      - '--tag'
      - 'sha-$SHORT_SHA'

images:
  - 'europe-west1-docker.pkg.dev/ordinal-avatar-479419-t7/theygrow-api-repo/api:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
