# -bin, not -all (L1-P3, LSC-DL-003). The `-all` archive is 214 MiB against
# `-bin`'s 131 MiB, and the extra 83 MiB is the Gradle SOURCES, which exist so an
# IDE can offer them. CI never reads them and neither does this project. Every
# job fetches this archive fresh from services.gradle.org, and that fetch is
# exactly where run 31640121268 died — so the smaller transfer is a smaller
# window for the same reset, not a fix for it. Same host, same version.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
