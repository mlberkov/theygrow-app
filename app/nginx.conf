events {}
http {
    include mime.types;

    # Логирование
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Производительность
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/manifest+json;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        # Health check
        location /health {
            access_log off;
            return 200 "healthy";
            add_header Content-Type text/plain;
        }

        # Service Worker — без агрессивного кэша
        location = /sw.js {
            add_header Cache-Control "no-cache, must-revalidate";
            add_header Service-Worker-Allowed "/";
        }

        # PWA Manifest
        location = /manifest.json {
            add_header Cache-Control "public, max-age=3600, must-revalidate";
            add_header Content-Type "application/manifest+json";
        }

        # KB-артефакт — immutable static (ADR-024, fork B): версия в имени
        # файла, содержимое по данному имени не меняется никогда. Узкий
        # паттерн: только /kb-v{N}.json; generic-статика остаётся без .json.
        location ~ ^/kb-v[0-9]+\.json$ {
            add_header Cache-Control "public, immutable, max-age=31536000";
            add_header Vary Accept-Encoding;
        }

        # Статика - агрессивный кэш
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            add_header Cache-Control "public, immutable, max-age=2592000";
            add_header Vary Accept-Encoding;
        }

        # HTML и главная - 1 час кэша
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "public, max-age=3600, must-revalidate";
            add_header Vary Accept-Encoding;
        }

        # Запретить доступ к скрытым файлам
        location ~ /\. {
            deny all;
        }
    }
}
