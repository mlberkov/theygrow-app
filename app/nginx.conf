events {}
http {
    include mime.types;

    # Логирование
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Производительность
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/manifest+json;

    server {
        listen 8080;

        # Редиректы называют адрес, а не контейнер (PPR-P4).
        #
        # nginx переписывает ЛЮБОЙ Location, начинающийся с `/`, в
        # scheme://host[:port] + URI. За Cloud Run известная ему схема — `http`
        # (TLS терминируется впереди), а порт — вот этот `listen 8080`, который
        # наружу не выставлен. Измерено на ревизии sha-e68dc2a: `return 301
        # /privacy` ниже ушёл как `location: http://<tagged-host>:8080/privacy` —
        # адрес, который не отвечает, под словом «конфиденциальность».
        #
        # Это настройка КЛАССА, а не заплатка на одну строку: любой будущий
        # `return 30x /path` в этом файле уедет дословно и останется внутри того
        # же origin, что и directory-редиректы самого nginx из `try_files $uri/`.
        # `return 30x https://…` не затрагивается — он не начинается с `/`, так
        # что осознанный кросс-origin редирект по-прежнему работает.
        # `port_in_redirect` намеренно НЕ ставится: абсолютный URL больше не
        # собирается вовсе, подавлять в нём нечего, и второй ключ читался бы как
        # работающий, ничего не делая.
        absolute_redirect off;

        root /usr/share/nginx/html;
        index index.html;

        # Health check
        location /health {
            access_log off;
            return 200 "healthy";
            add_header Content-Type text/plain;
        }

        # Same-origin /api proxy (A3-P1, vault ADR-038 / ADR-007). The browser reaches
        # /api only through this origin, so NO CORS header is issued here or anywhere
        # else in this file — that is the point of the topology, not an omission.
        #
        # `^~` is load-bearing, not decoration: a plain `location /api/` is a prefix
        # match and LOSES to the `~* \.(js|css|...)$` regex location below, so a future
        # /api/<something>.js would be served as (missing) static and 404 instead of
        # being proxied. `^~` tells nginx to stop before regex matching.
        #
        # This block is rendered from placeholders by app/docker-entrypoint.sh at
        # container start: the upstream is a live identifier and never committed.
        # The entrypoint also writes the include below — either the minted ID token
        # (`set $api_id_token "...";`) or, when the upstream is unconfigured, a
        # `return 503` that short-circuits ahead of proxy_pass. One file is the whole
        # configured/unconfigured toggle.
        #
        # Accepted residual risk (A3-DL-001): there is deliberately no `resolver`, so
        # ${API_UPSTREAM_HOST} is resolved ONCE at config load. An upstream address
        # change is therefore picked up only on a new revision or a container restart —
        # acceptable for a stable Cloud Run service URL, and the alternative (`resolver`
        # + a variable proxy_pass) is an http-level directive the delivery-contract
        # drift guard cannot see (A1-DL-008).
        location ^~ /api/ {
            include /etc/nginx/conf.d/api-id-token.conf;

            proxy_pass ${API_UPSTREAM_URL};
            proxy_http_version 1.1;

            # Cloud Run routes by SNI + Host and rejects a request that carries neither.
            # nginx defaults proxy_ssl_server_name to OFF, so this is required, not tidy.
            proxy_ssl_server_name on;
            proxy_set_header Host ${API_UPSTREAM_HOST};

            # Service-to-service identity. This REPLACES any Authorization header the
            # client sent — a browser-supplied bearer token cannot reach /api through
            # this proxy by design. A3-P2 sessions are therefore cookie-borne
            # (same-site), which is the intended posture; cookies pass through untouched.
            proxy_set_header Authorization "Bearer $api_id_token";

            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_redirect off;
            proxy_read_timeout 60s;
        }

        # Service Worker — без агрессивного кэша
        location = /sw.js {
            add_header Cache-Control "no-cache, must-revalidate";
            add_header Service-Worker-Allowed "/";
        }

        # PWA Manifest
        location = /manifest.json {
            add_header Cache-Control "public, max-age=3600, must-revalidate";
            add_header Content-Type "application/manifest+json";
        }

        # Политика конфиденциальности (PPR-P1). Точное совпадение, потому что
        # `location /` ниже отдаёт /index.html на всё неизвестное: без этого
        # блока /privacy молча вернул бы оболочку приложения со статусом 200 —
        # обещание о данных семьи, за которым стоит таблица навыков. try_files
        # с `=404` закрывает эту дверь в обе стороны: есть файл — есть документ,
        # нет файла — 404, и никогда откат на оболочку.
        #
        # Кэш — класс оболочки (1 час, must-revalidate), НИКОГДА не immutable:
        # документ версионируется собственным текстом и датой вступления в силу,
        # а не адресом, и новая редакция выходит по тому же URL.
        location = /privacy {
            try_files /privacy.html =404;
            add_header Cache-Control "public, max-age=3600, must-revalidate";
            add_header Vary Accept-Encoding;
        }

        # Тот же адрес со слешем. Отдельный блок, а не косметика: /privacy/ не
        # совпадает с точным location выше, попадает в `location /`, не находит
        # такого каталога — и снова получает оболочку. Один канонический адрес,
        # объявленный в CHANNEL_CONFIG.policyUrl, — это /privacy.
        location = /privacy/ {
            return 301 /privacy;
        }

        # KB-артефакт — immutable static (ADR-024, fork B): версия в имени
        # файла, содержимое по данному имени не меняется никогда. Узкий
        # паттерн: только /kb-v{N}.json; generic-статика остаётся без .json.
        location ~ ^/kb-v[0-9]+\.json$ {
            add_header Cache-Control "public, immutable, max-age=31536000";
            add_header Vary Accept-Encoding;
        }

        # Статика - агрессивный кэш
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            add_header Cache-Control "public, immutable, max-age=2592000";
            add_header Vary Accept-Encoding;
        }

        # HTML и главная - 1 час кэша
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "public, max-age=3600, must-revalidate";
            add_header Vary Accept-Encoding;
        }

        # Запретить доступ к скрытым файлам
        location ~ /\. {
            deny all;
        }
    }
}
