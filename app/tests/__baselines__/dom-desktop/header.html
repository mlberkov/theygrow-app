<header>
        <div class="header-top">
            <div class="header-left">
                <h1>Трекер развития навыков</h1>
            </div>
            <div class="header-right">
                <div class="profile-button" id="profileButton">
                    <span id="profileName">Тестовый профиль (1 г. 6 мес.)</span>
                    <div class="profile-dropdown" id="profileDropdown">
<div class="profile-dropdown-item active">Тестовый профиль (1 г. 6 мес.)</div>
<div class="profile-dropdown-item create-new">+ Создать новый профиль</div>
</div>
                </div>
                <!-- О ПРИЛОЖЕНИИ (L3-P3; значок сменён в UIP-P3). Постоянный вход
                     во вступительное окно, на ОБОИХ каналах и без объявлений: он
                     не предлагает действия, которого канал не выполняет, — он
                     открывает текст, который лежит в тех же байтах.

                     С UIP-P3 ЭТО ЕДИНСТВЕННЫЙ ВХОД, И ОТ ЭТОГО ЗАВИСИТ БОЛЬШЕ,
                     ЧЕМ РАНЬШЕ. Вступление больше не приходит само — ни на первом
                     запуске, ни в каком другом состоянии (решение владельца
                     2026-08-25). Внутри него лежат ссылка на политику
                     конфиденциальности (PDR-035, аннотация 2026-08-21: у ссылки
                     ровно два носителя — это окно и эта кнопка) и строка о том,
                     что у браузерной копии нет резервной. Обе достижимы ровно
                     через эту кнопку, поэтому она обязана быть видимой в ЛЮБОМ
                     состоянии, включая первый запуск: это утверждение, а не
                     пожелание, и его исполняет app/tests/behavior.spec.js
                     (UIP-P3-INV-001).

                     ЗНАЧОК «i», А НЕ «?» (UIP-P3). Вопросительный знак обещает
                     справку по затруднению — «что-то не получается, спроси
                     здесь»; за кнопкой лежит рассказ о приложении и документ о
                     данных, то есть сведения, а не помощь. Функция не менялась
                     ни на байт: тот же id, то же имя, тот же обработчик, то же
                     окно и та же ссылка внутри него.

                     ЗНАЧОК, А НЕ ПОДПИСЬ, и круг, а не пилюля: действие канала в
                     шапке одно и оно главное (см. .header-action), а это —
                     справка рядом с ним. Имя у кнопки нарочно шире её сегодняшнего
                     содержимого: «О приложении», а не «Инструкция». Окно позже
                     может стать несколькими разделами, и тогда меняется то, что
                     за кнопкой, а не кнопка.

                     Ни onclick, ни телеметрии здесь нет — как и у соседей, и с
                     UIP-P1 её нет вообще нигде (аннотация к ADR-043 от
                     2026-08-25 развернула гейт D, оставлявший GA4 до L4). -->
                <button type="button" class="header-help" id="aboutBtn" title="О приложении" aria-label="О приложении">
                    <svg class="header-help-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <circle cx="12" cy="12" r="9">
</circle>
                        <path d="M12 11v5">
</path>
                        <path d="M12 7.5h.01">
</path>
                    </svg>
                </button>
                <!-- Архив (L1-P3). Иконка — стрелка вниз: соглашение «получить
                     файл наружу». Не дискета: дискета означает «сохранить внутри
                     приложения» и вдобавок мертвый предмет для артефакта, весь
                     смысл которого — читаться через двадцать лет.
                     На десктопе иконка + подпись, на мобильном только иконка;
                     aria-label и title дословно повторяют видимую подпись.

                     DIA-P2: приходит СКРЫТЫМ и раскрывается только на нативном
                     канале (surfaces/channel.js). В браузере архив не
                     собирается вообще — веб-ветки в export/sink.js нет и не было
                     (LSC-DL-003 (m)), — а кнопка предлагала то, чего не
                     происходит. Разметка одна на оба канала: это ветка времени
                     выполнения, а не вторая сборка (LSC-P1-INV-002). -->
                <button type="button" class="header-action" id="exportBtn" hidden="" title="Сохранить архив" aria-label="Сохранить архив">
                    <svg class="header-action-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <path d="M12 3v11">
</path>
                        <path d="M8 10l4 4 4-4">
</path>
                        <path d="M4 19h16">
</path>
                    </svg>
                    <span class="header-action-label">Сохранить архив</span>
                </button>
                <!-- Дневник (DIA-P3). Иконка — раскрытая тетрадь с пером:
                     «записать своими словами», в отличие от галочки в таблице,
                     которая утверждает про ребёнка. Это разные объекты: отметка
                     — приписанное утверждение и живёт в неизменяемом журнале,
                     запись дневника — собственный текст родителя и правится
                     перезаписью (PDR-026 §4, правило 1).

                     Приходит СКРЫТОЙ и раскрывается только на нативном канале
                     (surfaces/channel.js): дневник пишется в устройственное
                     хранилище, а в браузере его нет вообще — store/bridge.js там
                     инертен по построению (LSC-P1-INV-001). Предлагать действие,
                     которого на этом канале не происходит, — ровно тот дефект,
                     который PDR-034 §1 назвал, а DIA-P2 закрыл для архива.

                     Ни события аналитики, ни onclick здесь нет — и с UIP-P1
                     аналитики нет ни на одном канале. -->
                <button type="button" class="header-action" id="diaryBtn" hidden="" title="Дневник" aria-label="Дневник">
                    <svg class="header-action-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <path d="M4 5h6a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4z">
</path>
                        <path d="M20 5h-6a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h6z">
</path>
                        <path d="M16 3l2 2-4 4h-2V7z">
</path>
                    </svg>
                    <span class="header-action-label">Дневник</span>
                </button>
                <!-- Приложение для Android (DIA-P2, ADR-047). Единственный канал
                     распространения — прямой APK со страницы релизов, не
                     магазин. Иконка — телефон со стрелкой внутрь: «положить
                     файл на устройство», в отличие от стрелки архива, которая
                     означает «достать файл наружу».

                     Приходит СКРЫТОЙ и раскрывается только в браузере И только
                     когда <meta name="theygrow-apk-release"> объявляет, что
                     релиз опубликован.

                     С L3-P3 ЭТО КНОПКА, А НЕ ССЫЛКА, и это не косметика. Она
                     больше никуда не ведёт: она открывает окно #installModal, в
                     котором сказано, что это за приложение и где живут данные, —
                     а сам адрес лежит на ссылке ВНУТРИ окна. Элемент,
                     открывающий диалог, — кнопка; вспомогательные технологии
                     называют её кнопкой, Пробел её нажимает, и браузер не
                     показывает адрес в статусной строке и не предлагает
                     «копировать ссылку» для действия, которое никуда не ведёт.
                     Ровно этим предмет в шапке и читался как случайная ссылка.

                     И С UIP-P3 ОНА БОЛЬШЕ НЕ ГОВОРИТ «СКАЧАТЬ APK». Кнопка ничего
                     не скачивает: она открывает окно, а файл предлагается внутри
                     него и только тому, чья платформа умеет его поставить
                     (PPR-P2-INV-002). Подпись обещала загрузку там, где загрузки
                     нет вообще — на десктопе, — и это записанный долг, который
                     Scope PPR-P2-INV-002 назвал словами «still reads «Скачать
                     APK» on a desktop where nothing is downloadable». Имя теперь
                     называет то, что за кнопкой: «Приложение для Android».

                     ВИДИМОЙ ПОДПИСИ БОЛЬШЕ НЕТ, и это разворот решения L3-P3
                     (решение владельца 2026-08-25, UIP-DL-003). Тот пакет оставил
                     подпись видимой на мобильном по измеренной ширине — 348 из
                     360, 400 из 412 — доводом «значок сам по себе не называет
                     ничего». Кнопка стала предметом того же вида, что архив и
                     дневник: значок в шапке, имя — в title/aria-label. Доступное
                     имя от подписи не зависело и не изменилось; исчезло только
                     то, что читает глаз. Правила #apkBtn в app.css, которые
                     держали подпись видимой, убраны вместе с ней.

                     Здесь НЕТ телеметрии. Аналитики нет ни у одной поверхности
                     с UIP-P1; отсутствие СИГНАЛА — по-прежнему решение. -->
                <button type="button" class="header-action" id="apkBtn" title="Приложение для Android" aria-label="Приложение для Android">
                    <svg class="header-action-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <rect x="6" y="2" width="12" height="20" rx="2">
</rect>
                        <path d="M12 7v7">
</path>
                        <path d="M9 11l3 3 3-3">
</path>
                    </svg>
                </button>
            </div>
        </div>
        <!-- ПОДЗАГОЛОВКА ЗДЕСЬ БОЛЬШЕ НЕТ (UIP-P3). Строка «Отслеживание развития
             навыков ребёнка по месяцам согласно возрастным нормам» стояла под
             шапкой и повторяла то, что вступительное окно уже говорит своими
             словами и подробнее. Шапка называет продукт и предлагает действия;
             объяснять, что это за продукт, — работа окна за кнопкой «i», а не
             второй строки, которую читают все и каждый раз. Правила
             .header-subtitle ушли из app.css вместе с ней: класс без предмета
             — это следующий пакет, который «почему-то не применяется». -->
    </header>
