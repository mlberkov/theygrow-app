<div id="createProfileModal" class="modal show">
        <div class="modal-content">
            <span class="modal-close" id="createProfileClose">×</span>
            <h2>Создать новый профиль</h2>
            <form id="createProfileForm">
                <div class="modal-form-group">
                    <label for="childName">Имя ребёнка:</label>
                    <input type="text" id="childName" name="childName" required="">
                </div>
                <div class="modal-form-group">
                    <label for="childBirthdate">Дата рождения:</label>
                    <input type="date" id="childBirthdate" name="childBirthdate" required="">
                </div>
                <div class="modal-buttons">
                    <button type="button" class="modal-button modal-button-secondary" id="cancelProfile">Отмена</button>
                    <button type="submit" class="modal-button modal-button-primary">Создать</button>
                </div>
            </form>
        </div>
    </div>
